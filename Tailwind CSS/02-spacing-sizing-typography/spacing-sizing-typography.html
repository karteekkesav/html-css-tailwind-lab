<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tailwind Spacing And Typography</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-6 text-slate-900">
  <main class="mx-auto max-w-4xl">
    <h1 class="text-3xl font-bold">Spacing, Sizing, And Typography</h1>

    <section class="mt-6 max-w-md rounded-lg border border-slate-200 bg-white p-6 shadow-sm">
      <p class="text-sm font-medium text-blue-600">Interview Card</p>
      <h2 class="mt-2 text-2xl font-bold">Profile Review</h2>
      <p class="mt-3 text-slate-600">This card uses padding, max-width, text size, color, and margin utilities.</p>
      <div class="mt-5 flex gap-3">
        <button class="rounded bg-slate-900 px-4 py-2 text-white">Approve</button>
        <button class="rounded border border-slate-300 px-4 py-2">Reject</button>
      </div>
    </section>
  </main>
</body>
</html>
