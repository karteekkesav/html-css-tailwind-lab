<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tailwind Utility-first Basics</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-6 text-slate-900">
  <main class="mx-auto max-w-3xl space-y-6">
    <h1 class="text-3xl font-bold">Utility-first Basics</h1>

    <section class="rounded-lg border border-slate-200 bg-white p-6 shadow-sm">
      <h2 class="text-xl font-semibold">Interview Button Example</h2>
      <p class="mt-2 text-slate-600">Each Tailwind class adds one small piece of styling.</p>

      <button class="mt-4 rounded-md bg-blue-600 px-4 py-2 font-medium text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
        Save Changes
      </button>
    </section>

    <section class="rounded-lg border border-slate-200 bg-white p-6">
      <h2 class="text-xl font-semibold">Class Breakdown</h2>
      <ul class="mt-3 space-y-2 text-sm text-slate-700">
        <li><code class="rounded bg-slate-100 px-1">rounded-md</code> adds border radius.</li>
        <li><code class="rounded bg-slate-100 px-1">bg-blue-600</code> adds background color.</li>
        <li><code class="rounded bg-slate-100 px-1">px-4 py-2</code> adds horizontal and vertical padding.</li>
        <li><code class="rounded bg-slate-100 px-1">hover:bg-blue-700</code> changes color on hover.</li>
      </ul>
    </section>
  </main>
</body>
</html>
