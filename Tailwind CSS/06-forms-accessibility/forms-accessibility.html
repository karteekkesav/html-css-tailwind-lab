<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tailwind Forms Accessibility</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-6 text-slate-900">
  <main class="mx-auto max-w-md">
    <form class="rounded-lg bg-white p-6 shadow-sm">
      <h1 class="text-2xl font-bold">Account Form</h1>

      <div class="mt-5">
        <label for="email" class="block text-sm font-medium text-slate-700">Email</label>
        <input id="email" type="email" placeholder="name@example.com" class="mt-2 w-full rounded-md border border-slate-300 px-3 py-2 focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-200">
      </div>

      <div class="mt-5">
        <label for="password" class="block text-sm font-medium text-slate-700">Password</label>
        <input id="password" type="password" aria-describedby="password-error" class="mt-2 w-full rounded-md border border-red-500 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-red-200">
        <p id="password-error" class="mt-2 text-sm text-red-600">Password is required.</p>
      </div>

      <button class="mt-6 w-full rounded-md bg-blue-600 px-4 py-2 font-medium text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
        Submit
      </button>
    </form>
  </main>
</body>
</html>
