<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tailwind Component Patterns</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-6 text-slate-900">
  <main class="mx-auto max-w-4xl space-y-6">
    <h1 class="text-3xl font-bold">Component Pattern Example</h1>

    <section class="grid gap-4 md:grid-cols-2">
      <article class="rounded-lg bg-white p-6 shadow-sm">
        <h2 class="text-xl font-semibold">Primary Action</h2>
        <p class="mt-2 text-slate-600">Reusable button styles become a React component in real projects.</p>
        <button class="mt-4 rounded-md bg-blue-600 px-4 py-2 font-medium text-white hover:bg-blue-700">
          Save
        </button>
      </article>

      <article class="rounded-lg bg-white p-6 shadow-sm">
        <h2 class="text-xl font-semibold">Secondary Action</h2>
        <p class="mt-2 text-slate-600">Variant classes can be mapped in JavaScript.</p>
        <button class="mt-4 rounded-md border border-slate-300 px-4 py-2 font-medium text-slate-700 hover:bg-slate-50">
          Cancel
        </button>
      </article>
    </section>
  </main>
</body>
</html>
