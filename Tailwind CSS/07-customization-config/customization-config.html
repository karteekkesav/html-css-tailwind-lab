<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tailwind Customization Concepts</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              600: "#2563eb",
              700: "#1d4ed8"
            }
          }
        }
      }
    };
  </script>
</head>
<body class="bg-slate-100 p-6 text-slate-900">
  <main class="mx-auto max-w-3xl rounded-lg bg-white p-6 shadow-sm">
    <h1 class="text-3xl font-bold">Custom Brand Token</h1>
    <p class="mt-3 text-slate-600">This page configures a custom <code>brand</code> color using the CDN config.</p>
    <button class="mt-5 rounded bg-brand-600 px-4 py-2 text-white hover:bg-brand-700">
      Brand Button
    </button>
  </main>
</body>
</html>
