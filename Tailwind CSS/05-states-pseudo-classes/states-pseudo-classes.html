<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tailwind States</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-6 text-slate-900">
  <main class="mx-auto max-w-3xl space-y-6">
    <h1 class="text-3xl font-bold">States And Variants</h1>

    <section class="rounded-lg bg-white p-6 shadow-sm">
      <div class="flex flex-wrap gap-3">
        <button class="rounded bg-blue-600 px-4 py-2 text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 active:bg-blue-800">
          Active Button
        </button>
        <button disabled class="rounded bg-blue-600 px-4 py-2 text-white disabled:cursor-not-allowed disabled:bg-slate-300">
          Disabled Button
        </button>
      </div>
    </section>

    <section class="group rounded-lg border border-slate-200 bg-white p-6 hover:border-blue-500">
      <h2 class="font-semibold group-hover:text-blue-600">Hover the card</h2>
      <p class="mt-2 text-slate-600">This title uses <code>group-hover:</code>.</p>
    </section>
  </main>
</body>
</html>
