<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WCAG Basics</title>
</head>
<body>
  <main>
    <h1>WCAG Basics</h1>

    <section aria-labelledby="pour-heading">
      <h2 id="pour-heading">POUR Principles</h2>
      <ul>
        <li><strong>Perceivable:</strong> Provide text alternatives for images.</li>
        <li><strong>Operable:</strong> Make all actions keyboard accessible.</li>
        <li><strong>Understandable:</strong> Use clear labels and error messages.</li>
        <li><strong>Robust:</strong> Use valid, semantic HTML.</li>
      </ul>
    </section>
  </main>
</body>
</html>
