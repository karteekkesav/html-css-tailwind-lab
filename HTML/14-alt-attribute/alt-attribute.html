<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>alt Attribute</title>
</head>
<body>
  <main>
    <h1>alt Attribute</h1>

    <figure>
      <img src="https://via.placeholder.com/320x180" alt="Sample dashboard chart showing monthly onboarding progress">
      <figcaption>Informative image with useful alt text.</figcaption>
    </figure>

    <img src="https://via.placeholder.com/80" alt="">
    <p>The second image is decorative, so its alt text is empty.</p>
  </main>
</body>
</html>
