<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>id vs class</title>
</head>
<body>
  <main>
    <h1 id="page-title">id vs class</h1>

    <p class="note">This paragraph uses a reusable class.</p>
    <p class="note">This paragraph uses the same reusable class.</p>

    <label for="account-number">Account number</label>
    <input id="account-number" name="accountNumber" type="text">
  </main>
</body>
</html>
