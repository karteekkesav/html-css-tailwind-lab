<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Block Inline Inline-block</title>
  <style>
    .box {
      border: 1px solid #333;
      margin: 8px;
      padding: 8px;
      width: 160px;
    }

    .inline-block {
      display: inline-block;
    }
  </style>
</head>
<body>
  <main>
    <h1>Block, Inline, And Inline-block</h1>

    <div class="box">Block element</div>
    <div class="box">Another block element</div>

    <p>
      This is an <span class="box">inline span</span> inside text.
    </p>

    <p>
      <span class="box inline-block">Inline-block</span>
      <span class="box inline-block">Inline-block</span>
    </p>
  </main>
</body>
</html>
