<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>div vs Semantic Tags</title>
</head>
<body>
  <h1>div vs Semantic Tags</h1>

  <section aria-labelledby="bad-heading">
    <h2 id="bad-heading">Generic Structure</h2>
    <div>
      <div>Home | Accounts | Support</div>
      <div>Account summary content</div>
      <div>Copyright information</div>
    </div>
  </section>

  <section aria-labelledby="good-heading">
    <h2 id="good-heading">Semantic Structure</h2>
    <header>
      <nav aria-label="Account navigation">
        <a href="#">Home</a>
        <a href="#">Accounts</a>
        <a href="#">Support</a>
      </nav>
    </header>
    <main>
      <p>Account summary content</p>
    </main>
    <footer>
      <p>Copyright information</p>
    </footer>
  </section>
</body>
</html>
