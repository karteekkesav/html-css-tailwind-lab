<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colors And Backgrounds</title>
  <style>
    .status {
      padding: 12px;
      border-left: 4px solid;
      background: #f8fafc;
    }

    .approved { border-color: #15803d; }
    .pending { border-color: #b45309; }
    .rejected { border-color: #b91c1c; }
  </style>
</head>
<body>
  <main>
    <h1>Colors And Backgrounds</h1>
    <p class="status approved">Approved: Address verified.</p>
    <p class="status pending">Pending: Identity review in progress.</p>
    <p class="status rejected">Rejected: Document image is unclear.</p>
  </main>
</body>
</html>
