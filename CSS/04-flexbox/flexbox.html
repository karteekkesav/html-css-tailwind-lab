<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexbox</title>
  <style>
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 16px;
      border: 1px solid #cbd5e1;
    }

    .actions {
      display: flex;
      gap: 8px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Flexbox</h1>
    <section class="toolbar">
      <h2>Onboarding Review</h2>
      <div class="actions">
        <button type="button">Back</button>
        <button type="button">Submit</button>
      </div>
    </section>
  </main>
</body>
</html>
