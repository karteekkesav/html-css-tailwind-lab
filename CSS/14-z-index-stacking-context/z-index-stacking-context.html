<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>z-index And Stacking Context</title>
  <style>
    .card {
      position: relative;
      width: 320px;
      padding: 24px;
      border: 1px solid #cbd5e1;
    }

    .tooltip {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 10;
      background: #111827;
      color: white;
      padding: 6px 10px;
    }
  </style>
</head>
<body>
  <main>
    <h1>z-index And Stacking Context</h1>
    <article class="card">
      <span class="tooltip">Tooltip</span>
      <h2>Upload Status</h2>
      <p>The tooltip is layered above the card content.</p>
    </article>
  </main>
</body>
</html>
