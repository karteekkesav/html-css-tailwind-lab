<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forms Focus Accessibility</title>
  <style>
    input {
      display: block;
      margin-bottom: 8px;
      padding: 8px;
      border: 1px solid #64748b;
    }

    input:focus-visible {
      outline: 3px solid #2563eb;
      outline-offset: 2px;
    }

    .error {
      color: #b91c1c;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <h1>Forms Focus Accessibility</h1>
    <label for="document-number">Document number</label>
    <input id="document-number" type="text" aria-describedby="document-error">
    <p id="document-error" class="error">Enter a valid document number.</p>
  </main>
</body>
</html>
