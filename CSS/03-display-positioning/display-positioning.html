<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Display And Positioning</title>
  <style>
    .card {
      position: relative;
      width: 320px;
      padding: 20px;
      border: 1px solid #cbd5e1;
    }

    .badge {
      position: absolute;
      top: 12px;
      right: 12px;
      padding: 4px 8px;
      background: #0f766e;
      color: white;
    }
  </style>
</head>
<body>
  <main>
    <h1>Display And Positioning</h1>
    <article class="card">
      <span class="badge">Pending</span>
      <h2>Address Verification</h2>
      <p>The badge is absolutely positioned inside the card.</p>
    </article>
  </main>
</body>
</html>
